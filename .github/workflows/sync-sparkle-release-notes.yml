name: Sync Sparkle release notes

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to sync
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: sparkle-release-notes
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Sync release body to appcast
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python3 .github/scripts/sync_sparkle_release_notes.py "$RELEASE_TAG"
      - name: Commit updated appcast
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          git diff --check
          if git diff --quiet -- appcast.xml; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- appcast.xml
          git commit -m "Sync Sparkle notes for $RELEASE_TAG"
          git push origin HEAD:main
